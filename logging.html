<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doro Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="login-container">

        <div class="doro-section">
            <img src="img/doro.png" alt="Doro" class="doro-image">
            <p>Iniciar Sesión</p>
        </div>

        <div class="login-box">
            <h2>INICIAR SESIÓN</h2>
            <p class="subtitle">Ingresa tus datos para continuar</p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Ej. Juan Perez">
                    <small id="errorNombre"></small>
                </div>

                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Nombre de usuario">
                    <small id="errorUsuario"></small>
                </div>

                <div class="input-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" placeholder="correo@ejemplo.com">
                    <small id="errorCorreo"></small>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Contraseña">
                    <small id="errorPassword"></small>
                </div>

                <div class="input-group">
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento">
                    <small id="errorFecha"></small>
                </div>

                <button type="submit" class="login-button">INICIAR SESIÓN</button>
                <p id="mensajeLogin"></p>

            </form>
        </div>

    </div>

    <script src="js/utileria.js"></script>

    <script>
        const formulario = document.getElementById("loginForm");

        // Cargar datos previos si ya existen en el navegador
        window.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem("usuarioData")) {
                const data = JSON.parse(localStorage.getItem("usuarioData"));
                document.getElementById("nombre").value = data.nombre || "";
                document.getElementById("usuario").value = data.usuario || "";
                document.getElementById("correo").value = data.correo || "";
                document.getElementById("fechaNacimiento").value = data.fechaNacimiento || "";
            }
        });

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const nombre = document.getElementById("nombre").value;
            const usuario = document.getElementById("usuario").value;
            const correo = document.getElementById("correo").value;
            const password = document.getElementById("password").value;
            const fechaNacimiento = document.getElementById("fechaNacimiento").value;

            document.getElementById("errorNombre").textContent = "";
            document.getElementById("errorUsuario").textContent = "";
            document.getElementById("errorCorreo").textContent = "";
            document.getElementById("errorPassword").textContent = "";
            document.getElementById("errorFecha").textContent = "";

            let formularioValido = true;

            // 1. Usar soloLetras
            if (!soloLetras(nombre)) {
                document.getElementById("errorNombre").textContent = "Ingresa solo letras y espacios.";
                formularioValido = false;
            }

            // 2. Usar validarUsuario
            if (!validarUsuario(usuario)) {
                document.getElementById("errorUsuario").textContent = "Usuario inválido (4-20 caracteres, letras, números o _).";
                formularioValido = false;
            }

            // 3. Usar validarCorreo
            if (!validarCorreo(correo)) {
                document.getElementById("errorCorreo").textContent = "Ingresa un correo electrónico válido.";
                formularioValido = false;
            }

            // 4. Usar validarPassword
            if (!validarPassword(password)) {
                document.getElementById("errorPassword").textContent = "Requiere 8+ caracteres, mayúscula, minúscula, número y especial.";
                formularioValido = false;
            }

            if (fechaNacimiento === "") {
                document.getElementById("errorFecha").textContent = "Selecciona tu fecha de nacimiento.";
                formularioValido = false;
            } else if (calcularEdad(fechaNacimiento) < 0) {
                document.getElementById("errorFecha").textContent = "La fecha de nacimiento no puede ser futura.";
                formularioValido = false;
            } else if (!esMayorDeEdad(fechaNacimiento)) {
                document.getElementById("errorFecha").textContent = "Debes ser mayor de edad para registrarte.";
                formularioValido = false;
            }

            // Redirección corregida a index.html
            if (formularioValido) {
                const datosUsuario = {
                    nombre,
                    usuario,
                    correo,
                    fechaNacimiento
                };

                localStorage.setItem("usuarioData", JSON.stringify(datosUsuario));
                window.location.href = "index.html"; 
            }
        });
    </script>

</body>

</html>
