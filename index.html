<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doro Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="login-container">

        <div class="doro-section">
            <img src="img/doro-login.png" alt="Doro" class="doro-image">
            <h2>¡Bienvenido, <span id="nombreUsuario">Commander</span>!</h2>
            <p id="correoUsuario"></p>
        </div>

        <hr>

        <div class="login-box">
            <h3>Panel de Verificación de Seguridad</h3>

            <!-- Verificación de Seguridad Secundaria -->
            <form id="verificacionForm">

                <div class="input-group">
                    <label for="pin">PIN de Seguridad (Máximo 4 dígitos)</label>
                    <input type="number" id="pin" placeholder="Ej. 1234">
                    <small id="errorPin"></small>
                </div>

                <div class="input-group">
                    <label for="nivel">Nivel de Acceso Solicitado (Rango 1 a 5)</label>
                    <input type="number" id="nivel" placeholder="Ej. 3">
                    <small id="errorNivel"></small>
                </div>

                <button type="submit" class="login-button">VERIFICAR ACCESO</button>

            </form>

            <button id="btnCerrarSesion" style="margin-top: 15px; background-color: #666;" class="login-button">CERRAR SESIÓN</button>
        </div>

    </div>

    <!-- MODAL -->
    <div id="edadModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img src="img/doro-login.png" alt="Doro" class="doro-modal">
            <h2>Resultado de Validación</h2>
            <p id="resultadoEdad"></p>
            <p id="resultadoVerificacion"></p>
            <button id="cerrarModal">CONTINUAR</button>
        </div>
    </div>

    <script src="js/utileria.js"></script>

    <script>
        const modal = document.getElementById("edadModal");
        const cerrarModal = document.querySelector(".close");
        const botonCerrar = document.getElementById("cerrarModal");

        let datosGuardados = null;

        // Comprobar si hay sesión iniciada desde el login
        window.addEventListener("DOMContentLoaded", () => {
            const dataStr = localStorage.getItem("usuarioData");
            if (!dataStr) {
                window.location.href = "login.html"; // Redirigir al login si no hay datos
                return;
            }

            datosGuardados = JSON.parse(dataStr);
            document.getElementById("nombreUsuario").textContent = datosGuardados.nombre;
            document.getElementById("correoUsuario").textContent = datosGuardados.correo;
        });

        document.getElementById("verificacionForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const pin = document.getElementById("pin").value;
            const nivel = parseInt(document.getElementById("nivel").value, 10);

            document.getElementById("errorPin").textContent = "";
            document.getElementById("errorNivel").textContent = "";

            let esValido = true;

            // 5. Usar validarLongitud
            if (!validarLongitud(pin, 4) || pin === "") {
                document.getElementById("errorPin").textContent = "El PIN no debe exceder los 4 dígitos.";
                esValido = false;
            }

            // 6. Usar validarRango
            if (isNaN(nivel) || !validarRango(nivel, 1, 5)) {
                document.getElementById("errorNivel").textContent = "El nivel debe estar entre 1 y 5.";
                esValido = false;
            }

            if (esValido) {
                // 7. Usar calcularEdad
                const edad = calcularEdad(datosGuardados.fechaNacimiento);

                // 8. Usar esMayorDeEdad
                const mayor = esMayorDeEdad(datosGuardados.fechaNacimiento);

                document.getElementById("resultadoEdad").textContent = 
                    `Edad actual: ${edad} años. Status: ${mayor ? "Mayor de Edad" : "Menor de Edad"}.`;
                
                document.getElementById("resultadoVerificacion").textContent = 
                    `PIN y Nivel (${nivel}) validados correctamente.`;

                modal.style.display = "flex";
            }
        });

        document.getElementById("btnCerrarSesion").addEventListener("click", () => {
            localStorage.removeItem("usuarioData");
            window.location.href = "login.html";
        });

        cerrarModal.addEventListener("click", () => modal.style.display = "none");
        botonCerrar.addEventListener("click", () => modal.style.display = "none");
        window.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });
    </script>

</body>

</html>
